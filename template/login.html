<!doctype html>
<html lang="en">
{% load static %}
  <head>
  	<title>Login 03</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	
	<link rel="stylesheet" href=" {% static 'login/css/style.css' %} ">

	  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	</head>
	<body>

	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h2 class="heading-section">Login #03</h2>
				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-md-7 col-lg-5">
					<div class="login-wrap p-4 p-md-5">
		      	<div class="d-flex">
		      		<div class="w-100">
		      			<h3 class="mb-4">Sign In</h3>
		      		</div>
							<div class="w-100">
								<p class="social-media d-flex justify-content-end">
									<a href="#" class="social-icon d-flex align-items-center justify-content-center"><span class="fa fa-facebook"></span></a>
									<a href="#" class="social-icon d-flex align-items-center justify-content-center"><span class="fa fa-twitter"></span></a>
								</p>
							</div>
		      	</div>
				{% block content %}
						<form method="POST"  class="login-form">
							{% csrf_token%}
		      		<div class="form-group">
<!--		      			<div class="icon d-flex align-items-center justify-content-center"><span class="fa fa-user"></span></div>-->
<!--						<div class="icon d-flex align-items-center justify-content-center"><span class="fa fa-user"></span></div>-->
		      			<input type="text" name="uname" class="form-control rounded-left" placeholder="Username" required>
		      		</div>
	            <div class="form-group">
<!--	            	<div class="icon d-flex align-items-center justify-content-center"><span class="fa fa-lock"></span></div>-->
	              <input type="password" name="pass" class="form-control rounded-left" placeholder="Password" required>
	            </div>

	            <div class="form-group d-flex align-items-center">
	            	<div class="w-100">
	            		<label class="checkbox-wrap checkbox-primary mb-0">Save Password
									  <input type="checkbox" checked>
									  <span class="checkmark"></span>
									</label>
								</div>
								<div class="w-100 d-flex justify-content-end">
		            	<button type="submit" class="btn btn-primary rounded submit">Login</button>
	            	</div>
	            </div>

	            <div class="form-group mt-4">
								<div class="w-100 text-center">
									<p class="mb-1">Don't have an account? <a href="{% url 'patientLogin' %}">Sign Up as Patient </a></p>
									<a href="{% url 'viewLogin'%}">Sign Up as Doctor </a>
									<p><a href="#">Forgot Password</a></p>
								</div>
	            </div>

	          </form>
						{% endblock %}

	        </div>
				</div>
			</div>
		</div>

	</section>

	<script src=" {% static 'login/js/jquery.min.js' %} "></script>
  <script src=" {% static 'login/js/popper.js' %} "></script>
  <script src=" {% static 'login/js/bootstrap.min.js' %} "></script>
  <script src=" {% static 'login/js/main.js' %} "></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

	</body>
</html>
